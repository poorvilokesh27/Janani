services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: janani_db
      MYSQL_USER: janani
      MYSQL_PASSWORD: janani
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [janani_mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mysql://janani:janani@mysql:3306/janani_db
      REDIS_URL: redis://redis:6379
      PORT: 4000
      CORS_ORIGINS: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  janani_mysql:
